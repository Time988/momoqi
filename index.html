<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fdf3ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="摸摸器">
<meta property="og:title" content="屈佳佳专用摸摸器">
<meta property="og:description" content="手指划过它的头顶，它会脸红、打呼噜、冒心心。">
<meta property="og:image" content="https://time988.github.io/momoqi/assets/og.jpg">
<meta property="og:url" content="https://time988.github.io/momoqi/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="屈佳佳专用摸摸器">
<meta name="twitter:description" content="手指划过它的头顶，它会脸红、打呼噜、冒心心。">
<meta name="twitter:image" content="https://time988.github.io/momoqi/assets/og.jpg">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="摸摸器">
<title>屈佳佳专用摸摸器</title>
<style>
  :root{
    --cream:#fdf3ea;
    --cream2:#ffe9dd;
    --pink:#ff9db3;
    --pink-deep:#f4708c;
    --ink:#6d4a3f;
    --ink-soft:#a3806f;
    --press:0;
    --lx:50%;
    --ly:34%;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:radial-gradient(120% 90% at 50% 8%,#fffaf4 0%,var(--cream) 42%,var(--cream2) 100%);
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:manipulation;
    -webkit-user-select:none;user-select:none;
    display:flex;flex-direction:column;
    height:100dvh;
    padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 14px);
  }
  /* ---------- background decorations ---------- */
  .bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
  .glow{
    position:absolute;left:50%;top:38%;width:78vmin;height:78vmin;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,192,205,.42),rgba(255,214,190,.16) 45%,transparent 68%);
    filter:blur(6px);
    animation:breathe 7s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.85}50%{transform:translate(-50%,-50%) scale(1.08);opacity:1}}
  .dust{position:absolute;border-radius:50%;background:#fff;opacity:.75;box-shadow:0 0 8px rgba(255,190,200,.8);
    animation:float linear infinite;}
  @keyframes float{
    0%{transform:translate3d(0,10vh,0) scale(.7);opacity:0}
    15%{opacity:.8}
    85%{opacity:.6}
    100%{transform:translate3d(6vw,-95vh,0) scale(1.1);opacity:0}
  }
  /* ---------- header ---------- */
  header{position:relative;z-index:2;text-align:center;flex:0 0 auto;padding-top:2px;}
  .title{
    font-size:15px;letter-spacing:.22em;color:var(--ink-soft);
    font-weight:600;
  }
  .title span{color:var(--pink-deep);}
  .hint{
    margin-top:7px;font-size:12.5px;color:var(--ink-soft);opacity:.85;
    transition:opacity .5s ease;
  }
  .hint.gone{opacity:0;}
  /* ---------- stage ---------- */
  .stage{
    position:relative;z-index:2;flex:1 1 auto;
    display:flex;align-items:center;justify-content:center;
    min-height:0;
  }
  .frame{
    position:relative;
    width:min(86vw, 58dvh, 392px);
    aspect-ratio:1/1;
    border-radius:34px;
    background:#fff;
    padding:7px;
    box-shadow:
      0 30px 60px -22px rgba(214,140,120,.55),
      0 8px 22px -10px rgba(214,140,120,.35),
      inset 0 0 0 1px rgba(255,255,255,.9);
    transform:rotate(-1.4deg);
    transition:transform .5s cubic-bezier(.2,.9,.3,1.2);
  }
  .pet{
    position:relative;width:100%;height:100%;border-radius:28px;overflow:hidden;
    touch-action:none;cursor:grab;
    transform:
      translateY(calc(var(--press) * 5px))
      scaleX(calc(1 + var(--press) * .045))
      scaleY(calc(1 - var(--press) * .055));
    transition:transform .16s cubic-bezier(.2,.8,.3,1);
    will-change:transform;
    background:#fbe8dc;
  }
  .pet img{
    width:100%;height:100%;object-fit:cover;display:block;
    filter:saturate(calc(1 + var(--press) * .18)) brightness(calc(1 + var(--press) * .05));
    transition:filter .18s linear;
    pointer-events:none;
  }
  /* finger light following the touch */
  .light{
    position:absolute;inset:-10%;pointer-events:none;
    background:radial-gradient(circle at var(--lx) var(--ly), rgba(255,255,255,.75) 0%, rgba(255,236,224,.42) 22%, transparent 46%);
    opacity:calc(.18 + var(--press) * .5);
    mix-blend-mode:soft-light;
    transition:opacity .2s linear;
  }
  /* blush */
  .blush{position:absolute;width:26%;height:15%;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(255,120,150,.55),rgba(255,120,150,0) 70%);
    filter:blur(6px);opacity:0;transition:opacity .25s linear;}
  .blush.l{left:19%;top:52%;}
  .blush.r{right:15%;top:52%;}
  .bubble{
    position:absolute;z-index:3;left:50%;top:-4px;
    transform:translate(-50%,-100%) scale(.9) rotate(1.4deg);
    background:#fff;color:var(--ink);
    font-size:14.5px;line-height:1.45;font-weight:600;
    padding:9px 14px;border-radius:16px;
    box-shadow:0 8px 22px -8px rgba(190,120,110,.45);
    white-space:nowrap;max-width:82vw;
    opacity:0;pointer-events:none;
    transition:opacity .2s ease, transform .25s cubic-bezier(.2,.9,.3,1.35);
  }
  .bubble::after{
    content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:#fff;
    transform:translateX(-50%) rotate(45deg);border-radius:2px;
  }
  .bubble.show{opacity:1;transform:translate(-50%,-100%) scale(1) rotate(1.4deg);}
  /* hint ring */
  .hintring{
    position:absolute;left:50%;top:26%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%);
    border:2px dashed rgba(255,255,255,.9);border-radius:50%;
    box-shadow:0 0 26px rgba(255,190,205,.85), inset 0 0 18px rgba(255,255,255,.5);
    pointer-events:none;animation:pulse 2.1s ease-in-out infinite;
    display:grid;place-items:center;font-size:19px;
  }
  .hintring.gone{opacity:0;transition:opacity .5s ease;}
  @keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(.94);opacity:.75}50%{transform:translate(-50%,-50%) scale(1.06);opacity:1}}
  /* fx layer */
  .fx{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:visible;}
  .fx span{
    position:absolute;font-size:20px;line-height:1;
    animation:rise .95s cubic-bezier(.2,.7,.3,1) forwards;
    will-change:transform,opacity;
  }
  @keyframes rise{
    0%{transform:translate(-50%,-50%) scale(.4) rotate(0deg);opacity:0}
    25%{opacity:1}
    100%{transform:translate(-50%,-160%) scale(1.05) rotate(var(--rot,18deg));opacity:0}
  }
  .fx span.pop{animation:popout .7s ease-out forwards}
  @keyframes popout{
    0%{transform:scale(.3);opacity:0}
    40%{transform:scale(1.15);opacity:1}
    100%{transform:scale(.9) translateY(-14px);opacity:0}
  }
  /* ---------- footer ---------- */
  footer{position:relative;z-index:2;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:9px;padding-bottom:2px;}
  .meter{
    width:min(64vw,260px);height:7px;border-radius:99px;background:#f3ddcf;overflow:hidden;
    box-shadow:inset 0 1px 2px rgba(180,130,110,.22);
  }
  .meter i{
    display:block;height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,#ffc3a0,#ff9db3);
    transition:width .45s cubic-bezier(.2,.9,.3,1);
    box-shadow:0 0 10px rgba(255,140,165,.7);
  }
  .row{display:flex;align-items:center;gap:14px;}
  .count{font-size:12.5px;color:var(--ink-soft);letter-spacing:.06em;}
  .count b{color:var(--pink-deep);font-size:16px;font-variant-numeric:tabular-nums;
    display:inline-block;transition:transform .2s cubic-bezier(.2,.9,.3,1.6);}
  .count b.bump{transform:scale(1.35);}
  .btn{
    border:0;background:rgba(255,255,255,.75);color:var(--ink-soft);
    width:30px;height:30px;border-radius:50%;font-size:14px;line-height:1;
    box-shadow:0 3px 10px -4px rgba(180,120,110,.5);
    display:grid;place-items:center;cursor:pointer;
  }
  .btn:active{transform:scale(.92);}
  .sig{font-size:11px;color:#c4a496;letter-spacing:.18em;margin-top:2px;}
  /* ---------- 添加到主屏幕提示 ---------- */
  .a2hs{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);
    transform:translate(-50%,150%);
    width:calc(100% - 32px);max-width:420px;z-index:9;
    background:#fff;border-radius:18px;
    box-shadow:0 14px 34px -12px rgba(190,120,110,.55);
    padding:11px 12px;transition:transform .45s cubic-bezier(.2,.9,.3,1.2);
  }
  .a2hs.show{transform:translate(-50%,0);}
  .a2hs-in{display:flex;align-items:center;gap:8px;}
  .a2hs-main{
    flex:1;border:0;background:transparent;text-align:left;cursor:pointer;
    font-size:13px;font-weight:600;color:var(--ink);padding:2px 2px;line-height:1.4;
  }
  .a2hs-x{
    border:0;background:#f6e6dc;color:#a3806f;width:24px;height:24px;border-radius:50%;
    font-size:14px;line-height:1;display:grid;place-items:center;cursor:pointer;flex:0 0 auto;
  }
  .a2hs-tip{
    margin-top:9px;padding-top:9px;border-top:1px dashed #f0ddd2;
    font-size:12.5px;line-height:1.6;color:var(--ink-soft);
  }
  @media (prefers-reduced-motion: reduce){ .a2hs{transition:none} }
  /* ---------- 彩蛋 · 每满 99 次 ---------- */
  .bubble.egg{
    color:#a4691a;
    background:linear-gradient(180deg,#fffdf6,#fff3d5);
    box-shadow:0 10px 30px -8px rgba(214,150,40,.55), 0 0 0 1px rgba(255,215,130,.9) inset;
  }
  .bubble.egg::after{ background:#fff8e6; }
  .flashgold{
    position:fixed;inset:0;pointer-events:none;z-index:15;opacity:0;
    background:radial-gradient(circle at 50% 42%, rgba(255,232,170,.9), rgba(255,196,120,.28) 38%, transparent 64%);
  }
  .flashgold.on{animation:goldflash 1.5s ease-out;}
  @keyframes goldflash{0%{opacity:0}16%{opacity:1}100%{opacity:0}}
  .badge-pop{
    position:fixed;left:50%;top:44%;z-index:16;pointer-events:none;
    font-weight:700;color:#b97b18;font-size:25px;letter-spacing:.08em;
    text-shadow:0 0 18px rgba(255,205,120,.95), 0 2px 6px rgba(180,120,40,.35);
    transform:translate(-50%,-50%) scale(.6);
    animation:badgepop 2.4s cubic-bezier(.2,.9,.3,1.3) forwards;
  }
  @keyframes badgepop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}
    18%{opacity:1;transform:translate(-50%,-52%) scale(1.06)}
    70%{opacity:1}
    100%{opacity:0;transform:translate(-50%,-72%) scale(1)}
  }

  /* ---------- 告白 / 终极彩蛋 遮罩 ---------- */
  .veil{
    position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;padding:26px;text-align:center;
    background:radial-gradient(circle at 50% 38%, rgba(255,228,238,.72), rgba(255,198,214,.62) 34%, rgba(255,234,222,.84) 74%);
    opacity:0;visibility:hidden;transition:opacity .7s ease, visibility .7s;
    -webkit-backdrop-filter:blur(13px) saturate(1.08);
    backdrop-filter:blur(13px) saturate(1.08);
  }
  .veil.show{opacity:1;visibility:visible;}
  .veil.hearts{
    background:radial-gradient(circle at 50% 38%, rgba(255,216,228,.74), rgba(255,170,190,.6) 34%, rgba(255,214,196,.86) 76%);
  }
  .veil-glow{
    position:absolute;left:50%;top:34%;width:min(94vw,540px);aspect-ratio:1;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,255,255,.9),rgba(255,180,200,.35) 42%,transparent 66%);
    filter:blur(10px);animation:breathe 6s ease-in-out infinite;pointer-events:none;
  }
  .veil-line{
    position:relative;z-index:2;max-width:20em;min-height:2.6em;
    display:flex;align-items:center;justify-content:center;
    font-size:21px;line-height:1.65;font-weight:600;color:#7a4a45;letter-spacing:.04em;
    opacity:0;transform:translateY(10px);
    transition:opacity .55s ease, transform .55s cubic-bezier(.2,.9,.3,1.2);
    text-shadow:0 1px 0 rgba(255,255,255,.75);
  }
  .veil-line.on{opacity:1;transform:none;}
  .veil-line.big{font-size:27px;color:#c2415c;}
  .veil-actions{position:relative;z-index:3;display:flex;gap:18px;align-items:center;margin-top:4px;}
  .vbtn{
    border:0;cursor:pointer;font-family:inherit;font-weight:700;letter-spacing:.08em;border-radius:999px;
    transition:transform .3s cubic-bezier(.2,.9,.3,1.3), box-shadow .3s ease, opacity .3s;
    -webkit-tap-highlight-color:transparent;
  }
  .vbtn-no{
    background:#fff;color:#e0576a;border:2px solid #f3b6bf;
    padding:13px 26px;font-size:16px;box-shadow:0 8px 20px -10px rgba(200,80,100,.6);
  }
  .vbtn-yes{
    background:linear-gradient(180deg,#5fd08a,#2fb06a);color:#fff;padding:15px 34px;font-size:17px;
    box-shadow:0 12px 26px -10px rgba(20,140,80,.75), 0 0 0 6px rgba(255,255,255,.5);
    --grow:1;
    animation:yesPulse 2.2s ease-in-out infinite;
  }
  @keyframes yesPulse{
    0%,100%{transform:scale(var(--grow,1))}
    50%{transform:scale(calc(var(--grow,1) * 1.045))}
  }
  .vbtn:active{transform:scale(.94);}
  .vbtn-continue{
    background:#fff;color:#c2415c;padding:14px 30px;font-size:16px;border:2px solid #f7c3cd;
    box-shadow:0 10px 24px -10px rgba(190,80,100,.6);
  }
  .vbtn[hidden]{display:none !important;}
  .veil-actions[hidden]{display:none !important;}
  .rain{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1;}
  .rain span{position:absolute;top:-8vh;font-size:18px;animation:fall linear forwards;}
  @keyframes fall{
    0%{transform:translateY(0) rotate(0);opacity:0}
    12%{opacity:.95}
    100%{transform:translateY(120vh) rotate(26deg);opacity:0}
  }
  .veil-face{
    position:relative;z-index:2;width:116px;height:116px;border-radius:50%;overflow:hidden;
    border:3px solid rgba(255,255,255,.94);
    box-shadow:0 16px 36px -14px rgba(200,80,110,.65), 0 0 0 9px rgba(255,255,255,.22);
    animation:faceIn .9s cubic-bezier(.2,.9,.3,1.25) both;
  }
  .veil-face img{width:100%;height:100%;object-fit:cover;display:block;}
  @keyframes faceIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
  .veil-sub{position:relative;z-index:2;font-size:12px;color:#c08c9c;letter-spacing:.24em;}

  @media (prefers-reduced-motion: reduce){
    .glow,.dust,.hintring{animation:none}
  }
</style>
</head>
<body>

<div class="bg" id="bg">
  <div class="glow"></div>
</div>

<header>
  <div class="title">屈佳佳专用 <span>摸摸器</span></div>
  <div class="hint" id="hint">手指划过它的头顶试试 ✋</div>
</header>

<div class="stage">
  <div class="frame">
    <div class="bubble" id="bubble">…</div>
    <div class="pet" id="pet">
      <img src="assets/pet.jpg?v=3" alt="小猫耳的他" draggable="false">
      <div class="light" id="light"></div>
      <div class="blush l" id="blushL"></div>
      <div class="blush r" id="blushR"></div>
    </div>
    <div class="hintring" id="hintring">✋</div>
    <div class="fx" id="fx"></div>
  </div>
</div>

<footer>
  <div class="meter"><i id="meterFill"></i></div>
  <div class="row">
    <div class="count">被摸了 <b id="count">0</b> 次</div>
    <button class="btn" id="soundBtn" aria-label="声音开关">🔊</button>
  </div>
  <div class="sig">— 仅供屈佳佳使用 —</div>
</footer>
<div class="flashgold" id="flashgold"></div>

<div class="veil" id="confess">
  <div class="veil-glow"></div>
  <div class="rain" id="confessRain"></div>
  <div class="veil-face"><img src="assets/pet.jpg?v=3" alt=""></div>
  <div class="veil-sub">520 次 · 佳佳</div>
  <div class="veil-line" id="confessLine"></div>
  <div class="veil-actions" id="confessActions" hidden>
    <button class="vbtn vbtn-no" id="btnRefuse">不愿意</button>
    <button class="vbtn vbtn-yes" id="btnAccept">我愿意</button>
  </div>
  <button class="vbtn vbtn-continue" id="btnResume" hidden>继续摸头</button>
</div>

<div class="veil" id="ultimate">
  <div class="veil-glow"></div>
  <div class="rain" id="ultimateRain"></div>
  <div class="veil-face"><img src="assets/pet.jpg?v=3" alt=""></div>
  <div class="veil-sub">一万次 · 彩蛋</div>
  <div class="veil-line big on" id="ultimateLine"></div>
  <button class="vbtn vbtn-continue" id="btnUltEnd">继续摸头</button>
</div>



<script>
(() => {
  "use strict";

  const pet      = document.getElementById("pet");
  const frame    = document.querySelector(".frame");
  const fxLayer  = document.getElementById("fx");
  const bubble   = document.getElementById("bubble");
  const hint     = document.getElementById("hint");
  const hintring = document.getElementById("hintring");
  const countEl  = document.getElementById("count");
  const meter    = document.getElementById("meterFill");
  const blushL   = document.getElementById("blushL");
  const blushR   = document.getElementById("blushR");
  const soundBtn = document.getElementById("soundBtn");
  const reduce   = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------------- background dust ---------------- */
  (function makeDust(){
    const bg = document.getElementById("bg");
    const n = reduce ? 6 : 16;
    for (let i = 0; i < n; i++){
      const d = document.createElement("div");
      d.className = "dust";
      const s = 2 + Math.random() * 3.5;
      d.style.width = d.style.height = s.toFixed(1) + "px";
      d.style.left = (Math.random() * 100).toFixed(1) + "vw";
      d.style.animationDuration = (9 + Math.random() * 9).toFixed(1) + "s";
      d.style.animationDelay = (-Math.random() * 14).toFixed(1) + "s";
      bg.appendChild(d);
    }
  })();

  /* ---------------- state ---------------- */
  const S = {
    press: 0,          // 0..1 当前被摸强度
    pressTarget: 0,
    pats: +(localStorage.getItem("pat-count") || 0),
    lastPatAt: 0,
    lastTouch: 0,
    lastMsgAt: 0,
    active: new Map(), // pointerId -> {x,y,dist,t0}
    idleTimer: 0,
    sound: localStorage.getItem("pat-sound") !== "off",
    locked: false,
    soundUnlocked: false,
    started: false,
  };
  countEl.textContent = S.pats;

  function setPress(v){
    S.pressTarget = Math.max(0, Math.min(1, v));
  }

  /* ---------------- speech ---------------- */
  // 来自语料库定稿：统一不加句号，保留逗号 / 省略号 / 问号
  const LINES = {
    start: ["还没准备好呢", "头发要乱了啦"],
    pat: [
      "再来一下嘛", "还没摸够呢", "再摸两下再走", "（把头往你手心蹭了蹭）", "……算了，你摸吧"
    ],
    rub: ["今天能不能多待一会儿", "还没摸够呢", "再来一下嘛", "再摸一下，就一下"],
    gentle: ["刚刚还在想你", "我也在想你呀", "……有点想你"],
    idle: [
      "……不摸了吗", "喂，还没摸够呢", "就这么走了啊", "（偷偷抬眼看你）",
      "你走了，我会想你的", "下次再来呀客官"
    ],
    many: ["头要摸秃啦", "佳佳，手累不累呀", "哼，谁准你摸的", "不要摸了啦，我又不是小猫"],
    miss: [
      "又想我了嘛，佳佳", "我也在想你呀", "……有点想你", "等我回来",
      "你一来，我就不困啦", "刚刚还在想你", "（其实一直在等你）", "好想见你", "好想你呀",
      "还以为你把我忘了呢", "想你的话，可以摸我吗", "你不在的时候，我就这样静静等你",
      "想我就摸摸头，很快我就回来啦"
    ],
    care: [
      "不要不开心哦", "今天累不累呀？", "有我在呢", "记得吃饭哦，别饿坏胃了",

  function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

  /* ---------------- sound: synthesized purr ---------------- */
  const Sound = {
    ctx: null, master: null, purrGain: null, lfo: null, ready: false,
    init(){
      if (this.ready) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const ctx = this.ctx = new AC();
      const master = this.master = ctx.createGain();
      master.gain.value = S.sound ? 0.9 : 0;
      master.connect(ctx.destination);

      // brown-ish noise -> 两级低通 -> 音量 -> 颤音（闷闷的呼噜）
      const len = ctx.sampleRate * 2;
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      let last = 0;
      for (let i = 0; i < len; i++){
        const white = Math.random() * 2 - 1;
        last = (last + 0.02 * white) / 1.02;
        d[i] = last * 2.6;
      }
      const src = ctx.createBufferSource();
      src.buffer = buf; src.loop = true;

      const hp = ctx.createBiquadFilter();
      hp.type = "highpass"; hp.frequency.value = 38;
      const lp1 = ctx.createBiquadFilter();
      lp1.type = "lowpass"; lp1.frequency.value = 420; lp1.Q.value = 0.7;
      const lp2 = ctx.createBiquadFilter();
      lp2.type = "lowpass"; lp2.frequency.value = 300; lp2.Q.value = 0.5;

      // 音量（只跟着被摸强度走，静置时为 0）
      const purrGain = this.purrGain = ctx.createGain();
      purrGain.gain.value = 0;

      // 颤音节点单独放，避免 LFO 把静音也抖成噪声
      const trem = ctx.createGain();
      trem.gain.value = 0.6;
      const lfo = ctx.createOscillator();
      const lfoGain = ctx.createGain();
      lfo.frequency.value = 26;     // ~呼噜颗粒感
      lfoGain.gain.value = 0.4;
      lfo.connect(lfoGain).connect(trem.gain);
      lfo.start();

      src.connect(hp).connect(lp1).connect(lp2).connect(purrGain).connect(trem).connect(master);
      src.start();
      this.ready = true;
    },
    resume(){ if (this.ctx && this.ctx.state === "suspended") this.ctx.resume(); },
    setOn(on){
      S.sound = on;
      localStorage.setItem("pat-sound", on ? "on" : "off");
      soundBtn.textContent = on ? "🔊" : "🔇";
      if (this.master){
        this.master.gain.setTargetAtTime(on ? 0.9 : 0, this.ctx.currentTime, 0.08);
      }
    },
    purr(level){
      if (!this.ready) return;
      const t = this.ctx.currentTime;
      const target = level < 0.03 ? 0 : Math.min(0.2, 0.03 + level * 0.17);
      this.purrGain.gain.setTargetAtTime(S.sound ? target : 0, t, 0.16);
    },
    blip(){
      if (!this.ready || !S.sound) return;
      const t = this.ctx.currentTime;
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = "triangle";
      o.frequency.setValueAtTime(520 + Math.random() * 90, t);
      o.frequency.exponentialRampToValueAtTime(760, t + 0.09);
      g.gain.setValueAtTime(0.0, t);
      g.gain.linearRampToValueAtTime(0.03, t + 0.014);
      g.gain.exponentialRampToValueAtTime(0.0006, t + 0.18);
      o.connect(g).connect(this.master);
      o.start(t); o.stop(t + 0.18);
    }
  };
  soundBtn.textContent = S.sound ? "🔊" : "🔇";
  soundBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    Sound.init(); Sound.resume();
    Sound.setOn(!S.sound);
    if (S.sound) Sound.blip();
  });

  /* ---------------- pat interaction ---------------- */
  function pointInPet(e){
    const r = pet.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top, r };
  }
  function updateLight(x, y){
    pet.style.setProperty("--lx", x + "px");
    pet.style.setProperty("--ly", y + "px");
  }
  function frameXY(x, y){
    const f = frame.getBoundingClientRect();
    const p = pet.getBoundingClientRect();
    return { x: x + (p.left - f.left), y: y + (p.top - f.top) };
  }

  function onDown(e){
    if (S.locked) return;
    const p = pointInPet(e);
    S.active.set(e.pointerId, { x: p.x, y: p.y, dist: 0, t: performance.now(), moved: 0 });
    try { pet.setPointerCapture(e.pointerId); } catch(_) {}
    updateLight(p.x, p.y);
    setPress(0.45);
    Sound.init(); Sound.resume();
    Sound.blip();
    if (!S.soundUnlocked){ S.soundUnlocked = true; try { Music.unlock(); } catch(_){} }

    const now = Date.now();
    if (now - S.lastTouch > 45000 && Math.random() < 0.7){
      say(pick(LINES.miss), 2200);
    }
    S.lastTouch = now;

    if (!S.started){
      S.started = true;
      hint.classList.add("gone");
      hintring.classList.add("gone");
      setTimeout(() => hintring.remove(), 600);
      say(pickMix(LINES.start, LINES.miss, 0.45), 1700);
    }
    const f = frameXY(p.x, p.y);
    spawnFx(f.x, f.y, "pop");
    clearTimeout(S.idleTimer);
    S.idleTimer = setTimeout(() => { say(pickMix(LINES.idle, LINES.miss, 0.6), 2600); }, 6000);
    e.preventDefault();
  }

  function onMove(e){
    if (S.locked) return;
    const a = S.active.get(e.pointerId);
    if (!a) return;
    const p = pointInPet(e);
    const dx = p.x - a.x, dy = p.y - a.y;
    const d = Math.hypot(dx, dy);
    a.x = p.x; a.y = p.y; a.dist += d; a.moved += d;
    updateLight(p.x, p.y);

    if (d > 0.4){
      setPress(Math.min(1, 0.45 + a.dist / 320));
      // sparkle trail every ~30px of travel
      if (a.dist - (a.lastSpawn || 0) > 34 && a.moved > 10){
        a.lastSpawn = a.dist;
        const f = frameXY(p.x, p.y);
        spawnFx(f.x, f.y);
      }
      if (a.moved > 55 && performance.now() - (a.lastSay || 0) > 2200){
        a.lastSay = performance.now();
        say(Math.random() < 0.6 ? pickMix(LINES.rub, LINES.care, 0.32) : pickMix(LINES.pat, LINES.miss, 0.3), 1800);
      }
    }
    e.preventDefault();
  }

  function onUp(e){
    if (S.locked){ S.active.clear(); return; }
    const a = S.active.get(e.pointerId);
    S.active.delete(e.pointerId);
    if (!a) return;
    const dt = performance.now() - a.t;
    const isTap = a.moved < 8 && dt < 400;
    const isRub = a.moved > 55;
    if (isTap || isRub || a.moved > 4){
      bumpCount(isRub ? 2 : 1);
      setPress(isTap ? 0.75 : 1);
    }
    if (isTap) say(pickMix(LINES.pat, LINES.miss, 0.35), 1500);
    else if (isRub && Math.random() < 0.5) say(pickMix(LINES.gentle, LINES.care, 0.5), 1900);
    if (navigator.vibrate) navigator.vibrate(isRub ? [10] : 8);
  }

  function bumpCount(n){
    const prev = S.pats;
    S.pats += n;
    S.lastPatAt = performance.now();
    localStorage.setItem("pat-count", S.pats);
    countEl.textContent = S.pats;
    countEl.classList.add("bump");
    setTimeout(() => countEl.classList.remove("bump"), 180);

    const lvl = Math.min(1, S.pats / 60);
    meter.style.width = (lvl * 100).toFixed(1) + "%";

    if (S.pats % 25 === 0 && !S.locked) say(pickMix(LINES.many, LINES.care, 0.45), 2200);

    /* ---- 彩蛋判定（按跨度算，rub 一次 +2 也不会漏） ---- */
    const crossed = (t) => prev < t && S.pats >= t;

    if (crossed(9999) && localStorage.getItem("ultimate-seen") !== "yes"){
      setTimeout(() => Ultimate.open(), 300);
      return;
    }
    if (crossed(520) && localStorage.getItem("confess") !== "yes"){
      setTimeout(() => Confess.open(), 320);
      return;
    }
    const hit = eggHit(prev, S.pats);
    if (hit){ setTimeout(() => egg99(hit), 260); return; }

    // 中途关掉页面后，10 分钟内没处理完的告白会在下一次摸头时回来
    if (!Confess.active && !Ultimate.active
        && localStorage.getItem("confess") !== "yes"
        && S.pats >= 520
        && Date.now() - (+localStorage.getItem("confess-seen") || 0) > 6e5){
      setTimeout(() => Confess.open(), 400);
    }
  }

  function eggHit(prev, next){
    for (let v = prev + 1; v <= next; v++){
      if (v === 9999 || v === 520) continue;
      if (v % 100 === 99 && localStorage.getItem("egg-" + v) !== "1") return v;
    }
    return 0;
  }

  pet.addEventListener("pointerdown", onDown);
  pet.addEventListener("pointermove", onMove);
  pet.addEventListener("pointerup", onUp);
  pet.addEventListener("pointercancel", onUp);
  pet.addEventListener("pointerleave", (e) => {
    if (!S.active.has(e.pointerId)) setPress(0);

  pet.addEventListener("contextmenu", (e) => e.preventDefault());
  document.addEventListener("gesturestart", (e) => e.preventDefault());

  /* fallback for very old webviews without Pointer Events */
  if (!window.PointerEvent){
    const fake = (t) => ({
      pointerId: t.identifier, clientX: t.clientX, clientY: t.clientY,
      preventDefault(){}, pointerType: "touch"
    });
    pet.addEventListener("touchstart", (e) => {
      for (const t of e.changedTouches) onDown(fake(t));
      e.preventDefault();
    }, { passive: false });
    pet.addEventListener("touchmove", (e) => {
      for (const t of e.changedTouches) onMove(fake(t));
      e.preventDefault();
    }, { passive: false });
    const end = (e) => {
      for (const t of e.changedTouches) onUp(fake(t));
      e.preventDefault();
    };
    pet.addEventListener("touchend", end, { passive: false });
    pet.addEventListener("touchcancel", end, { passive: false });
  }

  /* ---------------- rAF loop ---------------- */
  let raf = 0;
  const loop = () => {
    S.press += (S.pressTarget - S.press) * 0.22;
    if (!S.active.size) S.pressTarget *= 0.955;
    if (S.press < 0.004) S.press = S.pressTarget = 0;

    pet.style.setProperty("--press", S.press.toFixed(4));
    frame.style.transform = "rotate(" + (-1.4 + S.press * 1.1).toFixed(2) + "deg)";
    const blush = Math.max(0, (S.press - 0.35) / 0.65);
    blushL.style.opacity = blush.toFixed(3);
    blushR.style.opacity = blush.toFixed(3);
    Sound.purr(S.locked ? 0 : S.press);
    raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden){ cancelAnimationFrame(raf); S.press = S.pressTarget = 0; Sound.purr(0); }
    else raf = requestAnimationFrame(loop);
  });

  /* ---------------- 添加到主屏幕提示 ---------------- */

  /* ================= 彩蛋 · 告白 ================= */
  const flashEl   = document.getElementById("flashgold");
  const confVeil  = document.getElementById("confess");
  const confLine  = document.getElementById("confessLine");
  const confActs  = document.getElementById("confessActions");

  const Music = {
    el: null, raf: 0,
    init(){ if (this.el) return; const a = new Audio("assets/confession.m4a"); a.loop = true; a.preload = "auto"; a.volume = 0; this.el = a; },
    fade(to, sec){
      this.init(); const a = this.el, from = a.volume, t0 = performance.now();
      cancelAnimationFrame(this.raf);
      const step = (t) => {
        const k = Math.min(1, (t - t0) / (sec * 1000));
        a.volume = Math.max(0, Math.min(1, from + (to - from) * k));
        if (k < 1) this.raf = requestAnimationFrame(step);
      };
      this.raf = requestAnimationFrame(step);
    },
    play(){ this.init(); const pr = this.el.play(); if (pr && pr.catch) pr.catch(() => {}); this.fade(0.62, 2.8); },
    unlock(){
      this.init();
      const a = this.el;
      if (a.dataset.unlocked) return;
      a.muted = true;
      const pr = a.play();
      if (pr && pr.then) pr.then(() => {
        setTimeout(() => { try { a.pause(); a.currentTime = 0; } catch(_){} a.muted = false; a.dataset.unlocked = "1"; }, 80);
      }).catch(() => { a.muted = false; });
    },
    stop(){ if (!this.el) return; this.fade(0, 1.6); setTimeout(() => { try { this.el.pause(); this.el.currentTime = 0; } catch(_){} }, 1900); }
  };

  function chime(){
    Sound.init(); if (!Sound.ctx || !S.sound) return;
    const ctx = Sound.ctx, t = ctx.currentTime, notes = [784, 988, 1175, 1568];
    notes.forEach((f, i) => {
      const d = i * 0.11, o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(0, t + d);
      g.gain.linearRampToValueAtTime(0.05, t + d + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0006, t + d + 0.55);
      o.connect(g).connect(Sound.master || ctx.destination);
      o.start(t + d); o.stop(t + d + 0.6);
    });
  }

  let rainTimer = 0;

  function startRain(el, emojis, n){
    if (!el) return;
    stopRain();
    el.innerHTML = "";
    const total = reduce ? Math.min(n || 10, 8) : (n || 18);
    const drop = () => {
      if (el.childElementCount > total) el.firstElementChild && el.firstElementChild.remove();
      const sp = document.createElement("span");
      sp.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      sp.style.left = (Math.random() * 100).toFixed(1) + "%";
      sp.style.animationDuration = (7 + Math.random() * 6).toFixed(1) + "s";

      sp.style.color = ["#e0567c", "#d94f6e", "#c98a1e", "#e8748f"][Math.floor(Math.random() * 4)];
      sp.style.textShadow = "0 0 10px rgba(255,255,255,.85)";
      el.appendChild(sp);
      sp.addEventListener("animationend", () => sp.remove(), { once: true });
    };
    for (let i = 0; i < total; i++){
      drop();
      const last = el.lastElementChild;
      if (last) last.style.animationDelay = (-Math.random() * 7).toFixed(1) + "s";
    }
    rainTimer = setInterval(drop, reduce ? 1200 : 520);

      const a = Math.random() * Math.PI * 2, r = 50 + Math.random() * 130;
      const d = document.createElement("div");
      d.textContent = ["♥", "✦", "✧", "❋"][Math.floor(Math.random() * 4)];
      d.style.cssText = "position:fixed;left:50%;top:42%;z-index:16;pointer-events:none;color:#c98a1e;font-size:"
        + (14 + Math.random() * 12).toFixed(0) + "px;transform:translate(-50%,-50%);will-change:transform,opacity";
      document.body.appendChild(d);
      const dx = Math.cos(a) * r, dy = Math.sin(a) * r;
      const anim = d.animate([
        { transform: "translate(-50%,-50%) scale(.4)", opacity: 0 },
        { transform: `translate(calc(-50% + ${dx * .5}px), calc(-50% + ${dy * .5}px)) scale(1.1)`, opacity: 1, offset: .3 },
        { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(.9)`, opacity: 0 }
      ], { duration: 1000 + Math.random() * 600, easing: "cubic-bezier(.2,.8,.3,1)" });
      anim.onfinish = () => d.remove();

  function egg99(n, preview){
    if (!preview) localStorage.setItem("egg-" + n, "1");

    badgePop("♥ " + n + " 次纪念");

  const Confess = {
    active: false, timers: [], refused: 0, done: false,
    line(text, big){
      confLine.textContent = text;
      confLine.classList.toggle("big", !!big);
      confLine.classList.remove("on");
      void confLine.offsetWidth;
      confLine.classList.add("on");
    },
    clearTimers(){ this.timers.forEach(clearTimeout); this.timers = []; },
    later(ms, fn){ this.timers.push(setTimeout(fn, ms)); },
    open(preview){
      if (this.active || (!preview && localStorage.getItem("confess") === "yes")) return;
      this.active = true; this.done = false; this.refused = 0; this.preview = !!preview;
      S.locked = true; S.press = S.pressTarget = 0;
      if (!preview) localStorage.setItem("confess-seen", String(Date.now()));
      confVeil.classList.add("show", "hearts");

      startRain(document.getElementById("confessRain"), ["♥", "♡", "✦", "✧", "❀"], 18);
      Music.play();
      Sound.purr(0);
      this.stage(0);

    stage(i){
      const list = LINES.confess;
      if (i >= list.length){
        this.later(420, () => { confActs.hidden = false; });
        return;
      }
      this.line(list[i], i >= list.length - 2);
      this.later(i >= list.length - 2 ? 1650 : 1700, () => this.stage(i + 1));
    },
    refuse(){
      if (this.done) return;
      this.refused++;
      this.clearTimers();
      this.line(pick(LINES.refuse), false);
      const shrink = Math.max(0.72, 1 - this.refused * 0.07);
      btnRefuse.style.transform = `scale(${shrink})`;
      btnAccept.style.setProperty("--grow", Math.min(1.12, 1 + this.refused * 0.03).toFixed(3));
      btnRefuse.animate([
        { transform: `scale(${shrink}) translateX(0)` },
        { transform: `scale(${shrink}) translateX(-5px)` },
        { transform: `scale(${shrink}) translateX(5px)` },
        { transform: `scale(${shrink}) translateX(0)` }
      ], { duration: 320 });
      this.later(2000, () => {
        if (!this.done) this.line("做我女朋友吧", true);
      });
    },
    accept(){
      if (this.done) return;
      this.done = true;
      this.clearTimers();
      confActs.hidden = true;
      confVeil.classList.remove("hearts");
      goldBurst();
      startRain(document.getElementById("confessRain"), ["♥", "♡", "✦", "❀"], 26);
      const list = LINES.accept;
      list.forEach((t, i) => this.later(650 + i * 1700, () => this.line(t, i === list.length - 1)));
      this.later(650 + list.length * 1700 + 500, () => { btnResume.hidden = false; });
    },
    finish(){
      this.active = false;
      S.locked = false;
      if (!this.preview) localStorage.setItem("confess", "yes");
      confVeil.classList.remove("show");
      stopRain();
      Music.stop();
      badgePop("♥ 520");
      say("嗯，继续吧", 1900);
    }
  };

  const Ultimate = {
    active: false,
    open(preview){
      if (this.active) return;
      this.active = true; this.preview = !!preview;
      S.locked = true; S.press = S.pressTarget = 0;
      if (!preview) localStorage.setItem("ultimate-seen", "yes");
      ultLine.textContent = LINES.ultimate[0];
      ultVeil.classList.add("show");
      startRain(document.getElementById("ultimateRain"), ["✦", "✧", "❀", "♥"], 20);
      goldBurst();
      Music.play();
    },
    close(){
      this.active = false;
      S.locked = false;
      ultVeil.classList.remove("show");
      stopRain();
      Music.stop();
    }
  };

  btnRefuse.addEventListener("click", (e) => { e.stopPropagation(); Confess.refuse(); });
  btnAccept.addEventListener("click", (e) => { e.stopPropagation(); Confess.accept(); });
  btnResume.addEventListener("click", (e) => { e.stopPropagation(); Confess.finish(); });
  btnUltEnd.addEventListener("click", (e) => { e.stopPropagation(); Ultimate.close(); });

  /* 预览用：网址加 #520 / #9999 / #99 可直接看彩蛋（不写存档） */
  (function previewHash(){
    const h = (location.hash || "").replace("#", "");
    if (!h) return;
    if (h === "520") setTimeout(() => Confess.open(true), 900);
    else if (h === "9999") setTimeout(() => Ultimate.open(true), 900);
    else if (/^\d+$/.test(h) && (+h % 100 === 99)) setTimeout(() => egg99(+h, true), 900);
  })();

  /* first-idle nudge */
  setTimeout(() => {
    if (!S.started) say(pickMix(["……在看我吗？", "……来了呀。"], LINES.miss, 0.6), 2400);
  }, 5000);
})();
</script>

  <div class="a2hs-in">

    <button class="a2hs-x" id="a2hsX" aria-label="关闭">×</button>
  </div>
  <div class="a2hs-tip" id="a2hsTip" hidden></div>
</div>
</body>
