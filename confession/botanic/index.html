<!doctype html><html lang="zh-CN" data-ready="false" data-animating="false"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>一页花笺 · 给佳佳</title><link rel="stylesheet" href="../css/fonts.css?v=interactive-7"><link rel="stylesheet" href="style.css?v=interactive-7"><script src="garden.js?v=interactive-7" defer></script></head><body>
<main class="studio"><header class="studio-heading"><p class="script">A garden, from your fingertips</p><h1>把喜欢，种成一页花笺</h1><p>轻点留白处，添一丛花。慢慢来，这一页都留给你。</p></header>
<section class="paper" aria-label="亲手种花的花笺"><canvas id="garden" tabindex="0" role="img" aria-label="可以点击种花的工笔花笺。也可使用下方添一丛花按钮。"></canvas><p id="garden-note">花正在落笔…</p><span class="paper-inscription">给佳佳</span><span class="paper-seal" aria-hidden="true">心<br>意</span></section>
<div class="garden-tools"><div class="palette" aria-label="选择花色"><button data-palette="rose" aria-pressed="true"><i class="rose"></i>胭脂</button><button data-palette="ivory" aria-pressed="false"><i class="ivory"></i>月白</button><button data-palette="lilac" aria-pressed="false"><i class="lilac"></i>藤紫</button></div><div class="actions"><button id="add-plant" type="button">添一丛花</button><button id="undo-plant" type="button">撤下上一丛</button><button id="clear-garden" type="button">重新留白</button><button id="save-garden" type="button">把花笺留住 ↗</button></div></div><p class="status" id="garden-status" role="status" aria-live="polite">选一种花色，轻点留白，让花在你喜欢的地方舒展。</p><footer>花型绘制融合 <a href="https://github.com/LingDong-/nonflowers" target="_blank" rel="noopener">Lingdong Huang · Nonflowers</a> · <a href="NOTICE.txt">来源</a></footer>
</main></body></html>
